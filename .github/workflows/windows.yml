name: Windows application
on:
  workflow_dispatch:
  push:
    branches: [main, codex/bogini-schedule-2.2]
    paths:
      - '*.py'
      - 'assets/**'
      - 'tests/**'
      - 'requirements.txt'
      - '*.bat'
      - '.gitattributes'
      - 'BoginiSchedule.spec'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - '*.py'
      - 'assets/**'
      - 'tests/**'
      - 'requirements.txt'
      - '*.bat'
      - '.gitattributes'
      - 'BoginiSchedule.spec'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test editor and exports
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Validate Windows launcher
        shell: cmd
        run: call launch.bat --check
      - name: Build desktop application with Windows script
        shell: cmd
        run: call build.bat <nul
      - uses: actions/upload-artifact@v4
        with:
          name: BoginiSchedule-Windows
          path: dist/BoginiSchedule.exe
          if-no-files-found: error
